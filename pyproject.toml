[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-cli"
version = "1.0.0"
description = "A command-line personal assistant for contacts and notes"
requires-python = ">=3.10"

[project.scripts]
assistant = "main:main"

[tool.setuptools]
py-modules = ["main", "contact_book", "notes"]
